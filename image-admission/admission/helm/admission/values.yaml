replicaCount: 1

image:
  repository: docker.io/steveszabo/admission
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "admission"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  runAsNonRoot: true
  runAsUser: 33
  runAsGroup: 33
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  servicePort: 443
  containerPort: 8443

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  successThreshold: 1
  failureThreshold: 3
  httpGet:
    path: /health
    port: admission
    scheme: HTTPS

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  successThreshold: 1
  failureThreshold: 3
  httpGet:
    path: /health
    port: admission
    scheme: HTTPS

autoscaling:
  create: false
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  create: false
  minAvailable: 1
  matchLabels:
    app.kubernetes.io/name: admission

mutatingWebhook:
  name: admission.cloudserv.ca
  sideEffects: None
  timeoutSeconds: 10
  reinvocationPolicy: Never
  rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    apiVersions: ["*"]
    operations:
    - CREATE
    - UPDATE

secrets:
  certificate:
    ca: |
      todo
    crt: |
      todo
    key: |
      todo 

namespaces:
  exempt: |
    base-actions-arc-google
    base-actions-controller
    base-admission
    base-codefresh
    base-metrics
    base-terraform-agents
    calico-apiserver
    calico-system
    default
    kube-node-lease
    kube-public
    kube-system
    tigera-operator

environment:
- name: ADMISSION_BIND
  value: "0.0.0.0:8443"
- name: ADMISSION_WORKERS
  value: "1"
- name: ADMISSION_THREADS
  value: "25"
- name: ADMISSION_TIMEOUT
  value: "15"
- name: ADMISSION_KEEP_ALIVE
  value: "15"
- name: ADMISSION_LOG_LEVEL
  value: "debug"
- name: ADMISSION_SECURITY_POLICY_MODE
  value: "restricted"
- name: ADMISSION_SECURITY_POLICY_VERSION
  value: "latest"
- name: ADMISSION_ISTIO_INJECTION_MODE
  value: "enabled"

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}
tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/os
          operator: In
          values:
          - linux
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - admission
      topologyKey: kubernetes.io/hostname
